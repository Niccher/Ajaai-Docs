# ==============================================================================
# Docker Compose Configuration - Ajaia Collaborative Document Editor
#
# NOTE ON SECURITY & REVIEWER CONVENIENCE:
# - Ports 5432 (Postgres) and 9000/9001 (MinIO S3 / Console) are published to the host
#   specifically to allow reviewers to inspect DB tables and S3 blobs directly.
# - In a production cloud deployment, these services remain isolated within an internal
#   private Docker network with rotated credentials managed by a Secrets Manager.
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: ajaia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ajaia_docs
    ports:
      - "5432:5432" # Exposed for local reviewer inspection via TablePlus / DBeaver
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ajaia_docs"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ajaia_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # MinIO Web Console UI
    volumes:
      - minio_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ajaia_web
    restart: unless-stopped
    ports:
      - "${PORT:-80}:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend # Live reload development bind mount
      - ./frontend:/app/frontend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/ajaia_docs
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_BUCKET=ajaia-documents
      - MINIO_SECURE=false
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
